<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f8f9fa;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(230, 163, 228, 0.1);
    }

    body {
        background-color: #fff0f5;
    }

    h2 {
        color: #c45d83;
        font-weight: bold;
    }

    .form-control,
    .form-select {
        border: 1px solid #edc3d3;
        border-radius: 8px;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #d77e9e;
        box-shadow: 0 0 5px #edc3d3;
    }

    .btn-danger {
        background-color: #c45d83;
        border-color: #c45d83;
    }

    .btn-danger:hover {
        background-color: #a94369;
    }
</style>
<body>
    <div class="container mt-5">
        <h2>Registro de Asociados</h2>
        <form>
            <label for="documento" class="form-label">Número de documento:</label>
            <input type="number" class="form-control mb-3" id="documento" name="documento"
                placeholder="Ingrese el documento">

            <label for="nombres" class="form-label">Nombres:</label>
            <input type="text" class="form-control mb-3" id="nombres" name="nombres" placeholder="Ingrese los nombres">

            <label for="apellidos" class="form-label">Apellidos:</label>
            <input type="text" class="form-control mb-3" id="apellidos" name="apellidos"
                placeholder="Ingrese los apellidos">

            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento:</label>
            <input type="date" class="form-control mb-3" id="fechaNacimiento" name="fechaNacimiento">

            <label for="telefono" class="form-label">Teléfono:</label>
            <input type="tel" class="form-control mb-3" id="telefono" name="telefono" placeholder="Ingrese el teléfono">

            <label for="correo" class="form-label">Correo electrónico:</label>
            <input type="email" class="form-control mb-3" id="correo" name="correo" placeholder="ejemplo@correo.com">

            <label for="direccion" class="form-label">Dirección:</label>
            <input type="text" class="form-control mb-3" id="direccion" name="direccion"
                placeholder="Ingrese la dirección">

            <label for="fechaIngreso" class="form-label">Fecha de ingreso:</label>
            <input type="date" class="form-control mb-3" id="fechaIngreso" name="fechaIngreso">

            <label for="estado" class="form-label">Estado del asociado:</label>
            <select class="form-select mb-3" id="estado" name="estado">
                <option value="">Seleccione el estado</option>
                <option>Activo</option>
                <option>Inactivo</option>
            </select>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="reset" class="btn btn-light">Limpiar</button>
                <button type="button" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-danger">Registrar asociado</button>
            </div>
        </form>
    </div>

</body>

</html>
