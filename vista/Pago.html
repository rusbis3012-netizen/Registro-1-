<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos | Club Acerías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<style>
    .contenedor-tabla {
        margin: 30px;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(196, 93, 131, 0.15);
    }

    body {
        background-color: #fff0f5;
    }

    h2 {
        color: #c45d83;
        font-weight: bold;
    }

    .form-control,
    .form-select {
        border: 1px solid #edc3d3;
        border-radius: 8px;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #d77e9e;
        box-shadow: 0 0 5px #edc3d3;
    }

    .btn-danger {
        background-color: #c45d83;
        border-color: #c45d83;
    }

    .btn-danger:hover {
        background-color: #a94369;
    }
</style>

<body>
    <div id="contenedorTabla" class="contenedor-tabla">
        <h2 class="text-center mb-4">Tabla de pagos</h2>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Documento</th>
                            <th scope="col">Asociado</th>
                            <th scope="col">Valor</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Préstamo</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaPagos">
                        <tr>
                            <td colspan="6" class="text-center py-4">No hay pagos registrados.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-end mt-3">
            <button type="button" id="nuevoPago" class="btn btn-danger d-none" data-bs-toggle="modal"
                data-bs-target="#modalPago">
                + Nuevo pago
            </button>
        </div>
    </div>

    <div class="modal fade" id="modalPago" tabindex="-1" aria-labelledby="tituloModalPago"
        aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="tituloModalPago">Registro de pago</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formularioPago">
                        <label for="idPrestamo" class="form-label">Préstamo:</label>
                        <input type="number" class="form-control mb-3" id="idPrestamo" name="idPrestamo"
                            placeholder="Ingrese el ID del préstamo" required>

                        <label for="valorCuota" class="form-label">Valor del pago:</label>
                        <input type="number" class="form-control mb-3" id="valorCuota" name="valorCuota"
                            min="0" step="0.01" placeholder="Ingrese el valor" required>

                        <label for="fechaPago" class="form-label">Fecha del pago:</label>
                        <input type="date" class="form-control mb-3" id="fechaPago" name="fechaPago" required>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="reset" class="btn btn-light">Limpiar</button>
                            <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-danger">Registrar pago</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../controllers/Pago.js"></script>
</html>
