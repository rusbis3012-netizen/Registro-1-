<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f3cde6;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(230, 163, 228, 0.1);
    }

    body {
        background-color: #fff0f5;
    }

    h2 {
        color: #ce5883;
        font-weight: bold;
    }

    .form-control,
    .form-select {
        border: 1px solid #edc3d3;
        border-radius: 8px;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #d77e9e;
        box-shadow: 0 0 5px #edc3d3;
    }

    .btn-danger {
        background-color: #c45d83;
        border-color: #c45d83;
    }

    .btn-danger:hover {
        background-color: #a94369;
    }
</style>

<body>
       <h2 class="titulo-tabla">Tabla de actividades</h2>

    <div class="card shadow-sm contenedor-tabla">
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudo</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="5" class="text-center py-4">
                                Cargando actividades...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
       



    <div class="container mt-5">
        <h2 class="text-center mb-4">Actividades</h2>
        <form>
            <label for="New actividad">Nueva Actividad:</label>
            <input type="text" class="form-control mb-3" id="actividad" name="actividad"
                placeholder="Ingrese la actividad">
            <label for="Descripcion" class="form-label">Descripción: </label>
            <textarea class="form-control mb-3" id="descripcion" name="descripcion"
                placeholder="Ingrese la descripción"></textarea>
            <label for="fecha" class="form-label">Fecha de la actividad:</label>
            <input type="date" class="form-control mb-3" id="fecha" name="fecha">
            <label for="hora" class="form-label">municipio</label>
            <input type="time" class="form-control mb-3" id="hora" name="municipio">
            <label for="lugar" class="form-label">totalRecaudado</label>
            <input type="text" class="form-control mb-3" id="lugar" name="totalRecaudado"
                placeholder="Ingrese el lugar de la actividad">
            <label for="responsable" class="form-label">Responsable:</label>
            <input type="text" class="form-control mb-3" id="responsable" name="responsable"
                placeholder="Nombre del responsable">

            <label for="estado" class="form-label">Estado de la actividad:</label>
            <select class="form-select mb-3" id="estado" name="estado">
                <option value="">Seleccione un estado</option>
                <option>Programada</option>
                <option>En curso</option>
                <option>Finalizada</option>
                <option>Cancelada</option>
            </select>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="reset" class="btn btn-light">Limpiar</button>
                <button type="button" class="btn btn-secondary">Cancelar</button>
                <a href="TablaActividades.html">
                    <button type="submit" class="btn btn-danger">Guardar actividad
                </a>
                </button>
            </div>
        </form>
    </div>
    <script src = "../controllers/Actividades.js"></script>

</body>

</html>
