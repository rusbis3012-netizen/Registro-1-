<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<style>
    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f3cde6;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(230, 163, 228, 0.1);
    }

    body {
        background-color: #fff0f5;
    }

    h2 {
        color: #ce5883;
        font-weight: bold;
    }

    .form-control,
    .form-select {
        border: 1px solid #edc3d3;
        border-radius: 8px;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #d77e9e;
        box-shadow: 0 0 5px #edc3d3;
    }

    .btn-danger {
        background-color: #c45d83;
        border-color: #c45d83;
    }

    .btn-danger:hover {
        background-color: #a94369;
    }

    .contenedor-tabla {
        max-width: 1100px;
        margin: 30px auto;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 12px;
    }
</style>

<body>
    <div id="contenedorTabla" class="contenedor-tabla">
        <h2 class="text-center mb-4">Tabla de actividades</h2>

        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudo</th>
                            <th scope="col">Participantes</th>
                            <th scope="col">Estado</th>
                            <th scope="col">Fondo club</th>
                            <th scope="col">Por asociado</th>
                            <th id="encabezadoParticipacion" class="d-none" scope="col">Participación</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="9" class="text-center py-4">
                                Cargando actividades...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="text-end mt-3">
            <a id="nuevaActividad" href="RegistroActividades.html" class="btn btn-danger d-none">
                Nueva actividad
            </a>
        </div>
    </div>

    <script src="../controllers/Actividades.js"></script>

</body>

</html>
