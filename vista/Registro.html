<html lang=" es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <meta charset="UTF-8">
    <title>CLUB ADSO</title>
    <link rel = "Stylesheet" href="../Assets/css/Styles.css">
</head>

<body>
    <div class = "contenedor-formulario">
        <h2> Registro de Asociados Acerias </h2>
        <form id="formRegistro" action = "../modelo/guardarAsociado.php" method = "POST">
            <div class=" grupo-input">
               <label>Documento</label> 
               <input id="documento" name="documento" type="number" placeholder="ej: 1012345678" required>
            </div >
            <div class=" grupo-input">
                <label> Nombre</label>
                <input id="nombre" name="nombres" type="text" placeholder="ej : juana" required>
            </div>
             <div class=" grupo-input">
                <label> Apellido</label>
                <input id="Apellido" name="apellidos" type="text" placeholder="ej : Gonzalez" required>
            </div>
             <div class=" grupo-input">
                <label> Telefono</label>
                <input id="telefono" name="telefono" type="number" placeholder="ej : 3001234567" required>
            </div>
             <div class=" grupo-input">
                <label> Email</label>
                <input id="email" name="email" type="email" placeholder="ej : juana@gmail.com" required>
            </div>
               <div class=" grupo-input">
                <label> Fecha de nacimiento </label>
                <input id="FechaNacimiento" name="fechaNacimiento" type="date" required>
            </div>
             <div class=" grupo-input">
                <label>Direccion </label>
                <input id="Direccion" name="direccionResidencia" type="text" placeholder="ej :Cra 6 #15A-15" required>
            </div>
             <div class=" grupo-input">
                <label>Contraseña</label>
                <input id="Contraseña" name="contrasena" type="password" placeholder="Minimo 8 caracteres" minlength="8" required>
            </div>
             <div class=" grupo-input">
                <label>Confirmar Contraseña</label>
                <input id="ConfirmarContraseña" name="confirmarContrasena" type="password" placeholder="Minimo 8 caracteres" minlength="8" required>
            </div>
            
            
             <div class=" grupo-input">
                <label>Ciudad </label>
                <select id = "ciudad " name="ciudad" required>
                    <option value="Sogamoso"> Sogamoso </option>
                      <option value="Duitama"> Duitama </option>
                        <option value="Tunja"> Tunja </option>
                          <option value="Bogota"> Bogota </option>

                </select>
                
            </div>
             <div class=" grupo-input">
                 <label>Genero:</label>
                 <label>
                <input type = "radio" id = "Femenino" name = "genero" value = "Femenino" required>
                <span> Femenino</span>
                 </label>
                 <label>
                <input type = "radio" id = "Masculino " name = "genero" value = "Masculino">
                <span> Masculino</span>
                </label>
                <label>
                <input type = "radio" id = "Otro" name = "genero"  value="Otro">
                <span> Otro</span>
                </label>
            </div>

            
             <div class=" grupo-botones">
                <button type = "submit" > Guardar </button>
                <button type="reset"> Limpiar Formulario</button>
             </div>
             <p id = "mensajeRegistro" role = "status" aria-live="polite"></p>
        </form>
    </div>
    <script src="../controllers/Asociado.js"></script>
</body>



</html>
