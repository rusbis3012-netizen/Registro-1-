<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<style>
    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f3cde6;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(230, 163, 228, 0.1);
    }

    body {
        background-color: #fff0f5;
    }

    h2 {
        color: #ce5883;
        font-weight: bold;
    }

    .form-control,
    .form-select {
        border: 1px solid #edc3d3;
        border-radius: 8px;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #d77e9e;
        box-shadow: 0 0 5px #edc3d3;
    }

    .btn-danger {
        background-color: #c45d83;
        border-color: #c45d83;
    }

    .btn-danger:hover {
        background-color: #a94369;
    }
</style>
<body>
    
    <div class="container mt-5">
        <h2 class="text-center mb-4">Actividades</h2>
        <form id="formActividad">
            <input type="hidden" id="idActividad" name="idActividad">
            <label for="New actividad">Nueva Actividad:</label>
            <input type="text" class="form-control mb-3" id="nombreActividad" name="nombreActividad"
                placeholder="Ingrese la actividad">
            <label for="Descripcion" class="form-label">Descripción: </label>
            <textarea class="form-control mb-3" id="descripcion" name="descripcion"
                placeholder="Ingrese la descripción"></textarea>
            <label for="fecha" class="form-label">Fecha de la actividad:</label>
            <input type="date" class="form-control mb-3" id="fechaEvento" name="fechaEvento">
            <label for="lugar" class="form-label">municipio</label>
            <input type="text" class="form-control mb-3" id="municipio" name="municipio">
            <label for="totalRecaudo" class="form-label">Total recaudado:</label>
            <input type="number" class="form-control mb-1" id="totalRecaudo" name="totalRecaudado"
                min="0" step="0.01" placeholder="Ingrese el total recaudado">
            <small class="form-text d-block mb-3">
                Ingresa el total final al marcar la actividad como finalizada.
            </small>
            <label for="responsable" class="form-label">Responsable:</label>
            <input type="text" class="form-control mb-3" id="responsable" name="responsable"
                placeholder="Nombre del responsable">

            <label for="estado" class="form-label">Estado de la actividad:</label>
            <select class="form-select mb-3" id="estado" name="estado" required>
                <option value="Programada" selected>Programada</option>
                <option value="En curso">En curso</option>
                <option value="Finalizada">Finalizada</option>
                <option value="Cancelada">Cancelada</option>
            </select>
            <div class="alert alert-info py-2">
                Al finalizar se cierra la participación y se calcula el reparto. Si no hay participantes, todo el
                recaudo se asigna al fondo del club.
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="reset" class="btn btn-light">Limpiar</button>
                <button type="button" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-danger">Guardar actividad</button>
            </div>
        </form>
    </div>
    <script src = "../controllers/Actividades.js"></script>

</body>
</html>
