<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    .titulo-tabla {
        text-align: center;
        color: #ec9ac0;
        font-size: 2.5rem;
        margin: 25px 0;
    }

    .contenedor-tabla {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
    }

    .contenedor-tabla table {
        width: 100%;
        font-size: 1.1rem;
    }

    .contenedor-tabla thead th {
        background-color: #f186b8;
        color: white;
    }

    .boton-rosa {
        background-color: #f186b8;
        color: white;
        border: none;
    }

    .boton-rosa:hover {
        background-color: #d9689a;
        color: white;
    }
</style>



<body>
    <h2 class="titulo-tabla">Tabla de actividades</h2>

    <div class="card shadow-sm contenedor-tabla">
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudo</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="5" class="text-center py-4">
                                Cargando actividades...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <a href="Actividades.html" >
            <button type="button" class="btn btn-sm boton-rosa m-3">
                Nueva actividad
            </button>
        </a>
</body>

</html>
